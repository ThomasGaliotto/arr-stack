# Jellyseerr Configuration - Declarative Settings
# =============================================================================
# This file provides declarative configuration for Jellyseerr.
# Recyclarr can use this to manage user requests and queue settings.

instance: jellyseerr
server_url: http://jellyfin:8096/api/v1
radarr_api_key: ""  # Inject at runtime via orchestrator
sonarr_api_key: ""  # Inject at runtime via orchestrator
prowlarr_id: "1"
prowlarr_base_url: http://prowlarr:9692

user_preferences:
  default_quality_profile: default
  preferred_language: en,es,it,fr,de,zh-cn,jp-ja,korean
  enable_backlog: true
  auto_request_on_release: false
